  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: dbusers.kinda.rocks
spec:
  group: kinda.rocks
  names:
    kind: DbUser
    listKind: DbUserList
    plural: dbusers
    singular: dbuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: current dbuser status
      jsonPath: .status.status
      name: Status
      type: boolean
    - description: To which database user should have access
      jsonPath: .spec.databaseRef
      name: DatabaseName
      type: string
    - description: A type of access the user has
      jsonPath: .spec.accessType
      name: AccessType
      type: string
    - description: db-operator version of last full reconcile
      jsonPath: .status.operatorVersion
      name: OperatorVersion
      type: string
    - description: time since creation of resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: DbUser is the Schema for the dbusers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DbUserSpec defines a user and its access to a Database.
            properties:
              accessType:
                description: |-
                  AccessType is the access level to grant. Supported values are readOnly and readWrite.
                type: string
              cleanup:
                description: |-
                  Cleanup adds this DbUser as an owner of the Kubernetes resources it creates.
                  Kubernetes garbage collection then removes those resources with the DbUser.
                type: boolean
              credentials:
                description: Credentials configures generated credential data and Secret metadata.
                properties:
                  metadata:
                    description: |-
                      Metadata configures labels and annotations on the generated credential Secret.
                    properties:
                      extraAnnotations:
                        additionalProperties:
                          type: string
                        description: |-
                          ExtraAnnotations is merged into the generated Secret's annotations.
                          Values in this map replace existing values for the same keys.
                        type: object
                      extraLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          ExtraLabels is merged into the generated Secret's labels.
                          Values in this map replace existing values for the same keys.
                        type: object
                    type: object
                  templates:
                    description: |-
                      Templates defines additional data entries for generated Secrets and ConfigMaps.
                    items:
                      description: Template defines one generated credential entry.
                      properties:
                        name:
                          description: |-
                            Name is the data key written to the generated Secret or ConfigMap.
                          type: string
                        secret:
                          description: |-
                            Secret writes the entry to a Secret when true and to a ConfigMap when false.
                            DbUser templates must set this field to true.
                          type: boolean
                        template:
                          description: |-
                            Template is a Go template evaluated with database connection values and template helper functions.
                          type: string
                      required:
                      - name
                      - secret
                      - template
                      type: object
                    type: array
