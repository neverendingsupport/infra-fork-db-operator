    name: v1beta1
    schema:
      openAPIV3Schema:
        description: DbInstance is the Schema for the dbinstances API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DbInstanceSpec defines how db-operator connects to a database server.
            properties:
              adminSecretRef:
                description: |-
                  AdminUserSecret references the Secret containing the database administrator credentials.
                properties:
                  Name:
                    description: Name is the resource name.
                    type: string
                  Namespace:
                    description: Namespace is the resource namespace.
                    type: string
                required:
                - Name
                - Namespace
                type: object
              allowExtraGrants:
                description: |-
                  AllowExtraGrants permits Database resources to grant access to existing users
                  through their extraGrants field.
                type: boolean
              allowedPrivileges:
                description: |-
                  AllowedPrivileges lists database roles that DbUser resources may request in extraPrivileges.
                  ALL PRIVILEGES is not allowed.
                items:
                  type: string
                type: array
              backup:
                description: DbInstanceBackup configures storage used by Database backup jobs.
                properties:
                  bucket:
                    description: Bucket is the destination bucket for database dumps.
                    type: string
                required:
                - bucket
                type: object
              engine:
                description: |-
                  Engine is the database engine. Supported values are postgres and mysql.
                  This field is immutable.
                type: string
              generic:
                description: |-
                  GenericInstance configures an existing database server reachable by address and port.
                properties:
                  backupHost:
                    description: |-
                      BackupHost is the address used by backup jobs. When empty, backup jobs use host.
                    type: string
                  host:
                    description: |-
                      Host is the address db-operator uses to connect to the database server.
                      It cannot be set with hostFrom.
                    type: string
                  hostFrom:
                    description: FromRef selects one value from a Secret or ConfigMap.
                    properties:
                      key:
                        description: Key is the data key whose value should be read.
                        type: string
                      kind:
                        description: |-
                          Kind is the referenced resource kind. Supported values are Secret and ConfigMap.
                        type: string
                      name:
                        description: Name is the referenced resource name.
                        type: string
                      namespace:
                        description: Namespace is the referenced resource namespace.
                        type: string
                    required:
                    - key
                    - kind
                    - name
                    - namespace
                    type: object
                  port:
                    description: Port is the database server port. It cannot be set with portFrom.
                    type: integer
                  portFrom:
                    description: FromRef selects one value from a Secret or ConfigMap.
                    properties:
                      key:
                        description: Key is the data key whose value should be read.
                        type: string
                      kind:
                        description: |-
                          Kind is the referenced resource kind. Supported values are Secret and ConfigMap.
                        type: string
                      name:
                        description: Name is the referenced resource name.
                        type: string
                      namespace:
                        description: Namespace is the referenced resource namespace.
                        type: string
                    required:
                    - key
                    - kind
                    - name
                    - namespace
                    type: object
                  publicIp:
                    description: |-
                      PublicIP is the externally reachable address exposed in generated credentials.
                      It cannot be set with publicIpFrom.
                    type: string
                  publicIpFrom:
                    description: FromRef selects one value from a Secret or ConfigMap.
                    properties:
                      key:
                        description: Key is the data key whose value should be read.
                        type: string
                      kind:
                        description: |-
                          Kind is the referenced resource kind. Supported values are Secret and ConfigMap.
                        type: string
                      name:
                        description: Name is the referenced resource name.
                        type: string
                      namespace:
                        description: Namespace is the referenced resource namespace.
                        type: string
                    required:
                    - key
                    - kind
                    - name
                    - namespace
                    type: object
                type: object
              google:
                description: |-
                  GoogleInstance configures a Google Cloud SQL instance managed through the Google API.

                  Deprecated: Use GenericInstance. Google instances will be removed in v1beta2.
                properties:
                  apiEndpoint:
                    description: APIEndpoint overrides the Google SQL Admin API endpoint.
                    type: string
                  clientSecretRef:
                    description: |-
                      ClientSecret references the Secret containing Google API client credentials.
                    properties:
                      Name:
                        description: Name is the resource name.
                        type: string
                      Namespace:
                        description: Namespace is the resource namespace.
                        type: string
                    required:
                    - Name
                    - Namespace
                    type: object
                  configmapRef:
                    description: |-
                      ConfigmapName references a ConfigMap containing the Google instance configuration.
                    properties:
                      Name:
                        description: Name is the resource name.
                        type: string
                      Namespace:
                        description: Namespace is the resource namespace.
                        type: string
                    required:
                    - Name
                    - Namespace
                    type: object
                  instance:
                    description: InstanceName is the Google Cloud SQL instance name.
                    type: string
                required:
                - configmapRef
                - instance
                type: object
              instanceVars:
                additionalProperties:
                  type: string
                description: |-
                  InstanceVars provides values to credential templates through the InstanceVar function.
                  For example, a template can expose the address of a read-only PostgreSQL replica.
                type: object
              monitoring:
                description: DbInstanceMonitoring configures database monitoring.
                properties:
                  enabled:
                    description: |-
                      Enabled creates and configures a monitoring user for databases on this instance.
                    type: boolean
                required:
                - enabled
                type: object
              sslConnection:
                description: |-
                  DbInstanceSSLConnection configures TLS for connections from db-operator to the database server.
                properties:
                  enabled:
                    description: Enabled uses TLS for database connections.
                    type: boolean
                  skip-verify:
                    description: |-
                      SkipVerify accepts a server certificate without verifying its certificate authority or hostname.
                    type: boolean
                required:
                - enabled
                - skip-verify
                type: object
            required:
            - adminSecretRef
            - engine
            type: object
          status:
            description: DbInstanceStatus reports the observed state of a DbInstance.
            properties:
              checksums:
                description: |-
                  Checksums records the last observed values of referenced Secrets and ConfigMaps.
                additionalProperties:
                  type: string
                type: object
              info:
                description: Info contains connection values discovered for the instance.
                additionalProperties:
                  type: string
                type: object
              phase:
                description: Phase is the current reconciliation phase.
                type: string
              status:
                description: Status is true when the operator can connect to the database server.
                type: boolean
            required:
            - phase
            - status
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
