---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: databases.kinda.rocks
spec:
  group: kinda.rocks
  names:
    kind: Database
    listKind: DatabaseList
    plural: databases
    shortNames:
    - db
    singular: database
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: current db phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: current db status
      jsonPath: .status.status
      name: Status
      type: boolean
    - description: If database is protected to not get deleted.
      jsonPath: .spec.deletionProtected
      name: Protected
      type: boolean
    - description: instance reference
      jsonPath: .spec.instance
      name: DBInstance
      type: string
    - description: time since creation of resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Database is the Schema for the databases API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseSpec defines the desired state of Database
            properties:
              backup:
                description: DatabaseBackup defines the desired state of backup and
                  schedule
                properties:
                  cron:
                    type: string
                  enable:
                    type: boolean
                required:
                - cron
                - enable
                type: object
              cleanup:
                type: boolean
              connectionStringTemplate:
                description: |-
                  ConnectionStringTemplate field can be used to pass a custom template for generating a db connection string.
                  These keywords can be used: Protocol, DatabaseHost, DatabasePort, UserName, Password, DatabaseName.
                  Default template looks like this:
                  "{{ .Protocol }}://{{ .UserName }}:{{ .Password }}@{{ .DatabaseHost }}:{{ .DatabasePort }}/{{ .DatabaseName }}"
                type: string
              deletionProtected:
                type: boolean
              extensions:
                items:
                  type: string
                type: array
              instance:
                type: string
              postgres:
                description: Postgres struct should be used to provide resource that
                  only applicable to postgres
                properties:
                  dropPublicSchema:
                    description: If set to true, the public schema will be dropped
                      after the database creation
                    type: boolean
                  schemas:
                    description: Specify schemas to be created. The user created by
                      db-operator will have all access on them.
                    items:
                      type: string
                    type: array
                type: object
              secretName:
                type: string
              secretsTemplates:
                additionalProperties:
                  type: string
                type: object
            required:
            - backup
            - deletionProtected
            - instance
            - secretName
            type: object
          status:
            description: DatabaseStatus defines the observed state of Database
            properties:
              database:
                type: string
              instanceRef:
                description: DbInstance is the Schema for the dbinstances API
                properties:
                  apiVersion:
                    description: |-
                      APIVersion defines the versioned schema of this representation of an object.
                      Servers should convert recognized schemas to the latest internal value, and
                      may reject unrecognized values.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
                    type: string
                  kind:
                    description: |-
                      Kind is a string value representing the REST resource this object represents.
                      Servers may infer this from the endpoint the client submits requests to.
                      Cannot be updated.
                      In CamelCase.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  metadata:
                    type: object
                  spec:
                    description: DbInstanceSpec defines the desired state of DbInstance
                    properties:
                      adminSecretRef:
                        description: |-
                          NamespacedName is a fork of the kubernetes api type of the same name.
                          Sadly this is required because CRD structs must have all fields json tagged and the kubernetes type is not tagged.
                        properties:
                          Name:
                            type: string
                          Namespace:
                            type: string
                        required:
                        - Name
                        - Namespace
                        type: object
                      backup:
                        description: DbInstanceBackup defines name of google bucket
                          to use for storing database dumps for backup when backup
                          is enabled
                        properties:
                          bucket:
                            type: string
                        required:
                        - bucket
                        type: object
                      engine:
                        description: 'Important: Run "make generate" to regenerate
                          code after modifying this file'
                        type: string
                      generic:
                        description: |-
                          GenericInstance is used when instance type is generic
                          and describes necessary information to use instance
                          generic instance can be any backend, it must be reachable by described address and port
                        properties:
                          backupHost:
                            description: |-
                              BackupHost address will be used for dumping database for backup
                              Usually secondary address for primary-secondary setup or cluster lb address
                              If it's not defined, above Host will be used as backup host address.
                            type: string
                          host:
                            type: string
                          port:
                            type: integer
                          publicIp:
                            type: string
                        required:
                        - host
                        - port
                        type: object
                      google:
                        description: |-
                          GoogleInstance is used when instance type is Google Cloud SQL
                          and describes necessary information to use google API to create sql instances
                        properties:
                          apiEndpoint:
                            type: string
                          clientSecretRef:
                            description: |-
                              NamespacedName is a fork of the kubernetes api type of the same name.
                              Sadly this is required because CRD structs must have all fields json tagged and the kubernetes type is not tagged.
                            properties:
                              Name:
                                type: string
                              Namespace:
                                type: string
                            required:
                            - Name
                            - Namespace
                            type: object
                          configmapRef:
                            description: |-
                              NamespacedName is a fork of the kubernetes api type of the same name.
                              Sadly this is required because CRD structs must have all fields json tagged and the kubernetes type is not tagged.
                            properties:
                              Name:
                                type: string
                              Namespace:
                                type: string
                            required:
                            - Name
                            - Namespace
                            type: object
                          instance:
                            type: string
                        required:
                        - configmapRef
                        - instance
                        type: object
                      monitoring:
                        description: DbInstanceMonitoring defines if exporter
                        properties:
                          enabled:
                            type: boolean
                        required:
                        - enabled
                        type: object
                      sslConnection:
                        description: DbInstanceSSLConnection defines weather connection
                          from db-operator to instance has to be ssl or not
                        properties:
                          enabled:
                            type: boolean
                          skip-verify:
                            description: SkipVerity use SSL connection, but don't
                              check against a CA
                            type: boolean
                        required:
                        - enabled
                        - skip-verify
                        type: object
                    required:
                    - adminSecretRef
                    - engine
                    type: object
                  status:
                    description: DbInstanceStatus defines the observed state of DbInstance
                    properties:
                      checksums:
                        additionalProperties:
                          type: string
                        type: object
                      info:
                        additionalProperties:
                          type: string
                        type: object
                      phase:
                        description: 'Important: Run "make generate" to regenerate
                          code after modifying this file'
                        type: string
                      status:
                        type: boolean
                    required:
                    - phase
                    - status
                    type: object
                type: object
              monitorUserSecret:
                type: string
              phase:
                description: |-
                  Important: Run "make generate" to regenerate code after modifying this file
                  Add custom validation using kubebuilder tags: https://book-v1.book.kubebuilder.io/beyond_basics/generating_crd.html
                type: string
              proxyStatus:
                description: |-
                  DatabaseProxyStatus defines whether proxy for database is enabled or not
                  if so, provide information
                properties:
                  serviceName:
                    type: string
                  sqlPort:
                    format: int32
                    type: integer
                  status:
                    type: boolean
                required:
                - serviceName
                - sqlPort
                - status
                type: object
              status:
                type: boolean
              user:
                type: string
            required:
            - database
            - instanceRef
            - phase
            - status
            - user
            type: object
        type: object
    served: true
    storage: false
    subresources:
      status: {}
  - additionalPrinterColumns:
    - description: current db status
      jsonPath: .status.status
      name: Status
      type: boolean
    - description: If database is protected to not get deleted.
      jsonPath: .spec.deletionProtected
      name: Protected
      type: boolean
    - description: instance reference
      jsonPath: .spec.instance
      name: DBInstance
      type: string
    - description: db-operator version of last full reconcile
      jsonPath: .status.operatorVersion
      name: OperatorVersion
      type: string
    - description: time since creation of resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Database is the Schema for the databases API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseSpec defines the desired state of a database and its primary user.
            properties:
              backup:
                description: DatabaseBackup configures scheduled database dumps.
                properties:
                  cron:
                    description: Cron is the CronJob schedule expression.
                    type: string
                  enable:
                    description: |-
                      Enable creates a CronJob that dumps the database on the configured schedule.
                    type: boolean
                  envFromSecret:
                    description: |-
                      EnvFromSecret names a Secret whose data is exposed to the backup container as environment variables.
                    type: string
                required:
                - cron
                - enable
                type: object
              cleanup:
                description: |-
                  Cleanup adds this Database as an owner of the Kubernetes resources it creates.
                  Kubernetes garbage collection then removes those resources with the Database.
                type: boolean
              credentials:
                description: Credentials configures generated credential data and Secret metadata.
                properties:
                  metadata:
                    description: |-
                      Metadata configures labels and annotations on the generated credential Secret.
                    properties:
                      extraAnnotations:
                        additionalProperties:
                          type: string
                        description: |-
                          ExtraAnnotations is merged into the generated Secret's annotations.
                          Values in this map replace existing values for the same keys.
                        type: object
                      extraLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          ExtraLabels is merged into the generated Secret's labels.
                          Values in this map replace existing values for the same keys.
                        type: object
                    type: object
                  templates:
                    description: |-
                      Templates defines additional data entries for generated Secrets and ConfigMaps.
                    items:
                      description: Template defines one generated credential entry.
                      properties:
                        name:
                          description: |-
                            Name is the data key written to the generated Secret or ConfigMap.
                          type: string
                        secret:
                          description: |-
                            Secret writes the entry to a Secret when true and to a ConfigMap when false.
                            DbUser templates must set this field to true.
                          type: boolean
                        template:
                          description: |-
                            Template is a Go template evaluated with database connection values and template helper functions.
                          type: string
                      required:
                      - name
                      - secret
                      - template
                      type: object
                    type: array
                type: object
              deletionProtected:
                description: |-
                  DeletionProtected keeps the database and its primary user in the database backend
                  when the Database resource is deleted.
                type: boolean
              existingUser:
                description: |-
                  ExistingUser names an existing database user to use as the primary user.
                  The operator grants and revokes permissions for this user but does not create or delete it.
                type: string
              extraGrants:
                description: |-
                  ExtraGrants grants other existing database users access to this database.
                  The referenced DbInstance must set allowExtraGrants to true.
                items:
                  properties:
                    accessType:
                      description: |-
                        AccessType is the access level to grant. Supported values are readOnly and readWrite.
                      type: string
                    user:
                      type: string
                  required:
                  - accessType
                  - user
                  type: object
                type: array
              instance:
                description: |-
                  Instance is the name of the cluster-scoped DbInstance that hosts the database.
                  This field is immutable.
                type: string
              postgres:
                description: Postgres configures behavior that applies only to PostgreSQL databases.
                properties:
                  dropPublicSchema:
                    description: |-
                      DropPublicSchema removes the public schema after the database is created.
                    type: boolean
                  extensions:
                    items:
                      type: string
                    type: array
                  schemas:
                    description: |-
                      Schemas lists schemas to create. The primary user receives full access to each schema.
                    items:
                      type: string
                    type: array
                  template:
                    description: |-
                      Template is the PostgreSQL template database used to create this database.
                      This field is immutable.
                    type: string
                type: object
              secretName:
                description: |-
                  SecretName is the name of the Secret that stores the generated database credentials.
                type: string
              secretsTemplates:
                description: |-
                  SecretsTemplates maps Secret data keys to legacy credential templates.
                  It cannot be used with credentials.templates.

                  Deprecated: Use credentials.templates instead.
                additionalProperties:
                  type: string
                type: object
            required:
            - deletionProtected
            - instance
            - secretName
            type: object
          status:
            description: DatabaseStatus reports the observed state of a Database.
            properties:
              database:
                type: string
              engine:
                type: string
              extraGrants:
                description: |-
                  ExtraGrants records the grants applied during the last successful reconciliation.
                items:
                  properties:
                    accessType:
                      description: |-
                        AccessType is the access level to grant. Supported values are readOnly and readWrite.
                      type: string
                    user:
                      type: string
                  required:
                  - accessType
                  - user
                  type: object
                type: array
              monitorUserSecret:
                type: string
              operatorVersion:
                description: |-
                  OperatorVersion is the db-operator version that last completed reconciliation.
                type: string
              proxyStatus:
                description: |-
                  DatabaseProxyStatus reports the connection proxy created for a Database.
                properties:
                  serviceName:
                    type: string
                  sqlPort:
                    format: int32
                    type: integer
                  status:
                    description: Status is true when the proxy is ready.
                    type: boolean
                required:
                - serviceName
                - sqlPort
                - status
                type: object
              status:
                description: Status is true after the database reconciles successfully.
                type: boolean
              user:
                type: string
            required:
            - database
            - engine
            - status
            - user
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
